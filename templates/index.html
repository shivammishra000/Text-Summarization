<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Summarizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      width: 90%;
      max-width: 700px;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      font-size: 16px;
      font-weight: 500;
      color: #444;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: 0.3s;
    }

    textarea:focus {
      border-color: #66a6ff;
      box-shadow: 0 0 5px rgba(102, 166, 255, 0.5);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #66a6ff;
      color: white;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #558de8;
    }

    .summary-box {
      margin-top: 25px;
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #66a6ff;
      border-radius: 8px;
      color: #333;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      textarea {
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Text Summarization</h2>
    <form method="POST" action="/">
      <label for="input_text">Enter your text or dialogue:</label>
      <textarea id="input_text" name="input_text" placeholder="Paste or write your text here..." required>{{ input_text }}</textarea>
      <button type="submit" class="btn">Summarize</button>
    </form>

    {% if summary %}
    <div class="summary-box">
      <strong>Summary:</strong><br>
      {{ summary }}
    </div>
    {% endif %}
  </div>
</body>
</html>
