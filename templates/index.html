<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Summarizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #f4f7fc;
      width: 90%;
      max-width: 700px;
      padding: 35px 45px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      color: #1e3c72;
      margin-bottom: 20px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    label {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      border: 2px solid #cfd8ef;
      border-radius: 10px;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: 0.3s;
      background-color: #fff;
    }

    textarea:focus {
      border-color: #5a7bff;
      box-shadow: 0 0 10px rgba(90, 123, 255, 0.5);
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: linear-gradient(135deg, #5a7bff, #8e44ad);
      color: white;
      font-size: 17px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, #4a68e8, #7d3cb0);
      box-shadow: 0 5px 15px rgba(93, 76, 255, 0.4);
      transform: translateY(-1px);
    }

    .summary-box {
      margin-top: 25px;
      background: #eef1fb;
      padding: 15px;
      border-left: 5px solid #5a7bff;
      border-radius: 10px;
      color: #222;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      textarea {
        height: 150px;
      }
    }
</style>

</head>

<body>
  <div class="container">
    <h2>Text Summarization</h2>
    <form method="POST" action="/">
      <label for="input_text">Enter your text or dialogue:</label>
      <textarea id="input_text" name="input_text" placeholder="Paste or write your text here..." required>{{ input_text }}</textarea>
      <button type="submit" class="btn">Summarize</button>
    </form>

    {% if summary %}
    <div class="summary-box">
      <strong>Summary:</strong><br>
      {{ summary }}
    </div>
    {% endif %}
  </div>
</body>
</html>
